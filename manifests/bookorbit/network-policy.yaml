apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookorbit-postgres
  namespace: bookorbit
spec:
  podSelector:
    matchLabels:
      app: bookorbit-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bookorbit
        - podSelector:
            matchLabels:
              app: download-cache-cleanup
      ports:
        - protocol: TCP
          port: 5432

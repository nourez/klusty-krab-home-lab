apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner
  namespace: codex-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-runner
  template:
    metadata:
      labels:
        app: codex-runner
    spec:
      serviceAccountName: codex-runner
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
          command: [/bin/bash, /opt/codex-runner/bootstrap.sh]
          env:
            - name: CODEX_VERSION
              value: "0.159.1"
            - name: KUBECTL_VERSION
              value: v1.32.5
          ports:
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            # The pinned image defaults to root for bootstrap and sshd.
            # Leave runAsUser unset so the projected token retains mode 0644
            # for SSH user runner. Do not use fsGroup on the home PVC: it
            # can broaden persisted SSH private-key permissions.
            allowPrivilegeEscalation: false
            # Bubblewrap needs nested namespaces. Install the named AppArmor
            # profile on the node before syncing (see README).
            # SSH sessions run as UID 1000, without sudo or added capabilities.
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Localhost
              localhostProfile: codex-runner
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/runner
            - name: bootstrap
              mountPath: /opt/codex-runner
              readOnly: true
            - name: authorized-keys
              # A projected Secret directory is 1777, which sshd StrictModes
              # rejects. Mount only the file under a root-owned 0755 directory.
              mountPath: /etc/codex-runner/keys/authorized_keys
              subPath: authorized_keys
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: codex-runner-home
        - name: bootstrap
          configMap:
            name: codex-runner-bootstrap
        - name: authorized-keys
          secret:
            secretName: codex-runner-ssh
            defaultMode: 0444

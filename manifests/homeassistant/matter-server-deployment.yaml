apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: homeassistant
  labels:
    app: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          env:
            - name: TZ
              value: America/Toronto
            - name: STORAGE_PATH
              value: /data
            - name: LISTEN_ADDRESS
              value: "127.0.0.1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 5580
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5580
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data

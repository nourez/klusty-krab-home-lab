apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf-hardcover-sync
  namespace: audiobookshelf-hardcover-sync
  labels:
    app: audiobookshelf-hardcover-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf-hardcover-sync
  template:
    metadata:
      labels:
        app: audiobookshelf-hardcover-sync
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sync
          image: ghcr.io/drallgood/audiobookshelf-hardcover-sync:3.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: web-ui
              containerPort: 8080
          env:
            - name: AUDIOBOOKSHELF_URL
              valueFrom:
                configMapKeyRef:
                  name: sync-config
                  key: AUDIOBOOKSHELF_URL
            - name: ENABLE_WEB_UI
              value: "true"
            - name: DATA_DIR
              value: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audiobookshelf-hardcover-sync-data
      restartPolicy: Always

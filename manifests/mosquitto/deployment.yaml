apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mqtt
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883
      initContainers:
        - name: generate-passwd
          image: eclipse-mosquitto:2.1.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mosquitto_passwd -b -c \
                /mosquitto/pwfile/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"
              chown 1883:1883 /mosquitto/pwfile/passwd
              chmod 640 /mosquitto/pwfile/passwd
          env:
            - name: MQTT_USERNAME
              value: homeassistant
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: password
          volumeMounts:
            - name: pwfile
              mountPath: /mosquitto/pwfile
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
            allowPrivilegeEscalation: false
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: pwfile
              mountPath: /mosquitto/pwfile
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: pwfile
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data

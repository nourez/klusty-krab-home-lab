apiVersion: apps/v1
kind: Deployment
metadata:
  name: crosspoint-sync
  namespace: crosspoint-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crosspoint-sync
  template:
    metadata:
      labels:
        app: crosspoint-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: crosspoint-sync
          # Upstream publishes the current version on the main tag.
          image: ghcr.io/crosspoint-reader/crosspoint-sync:main
          imagePullPolicy: Always
          command:
            - node
          args:
            - --import
            - /patches/bookorbit-audioless.mjs
            - dist/index.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: DATABASE_PATH
              value: /data/crosspoint.db
            # Accounts already exist; keep public registration closed.
            - name: REGISTRATION_DISABLED
              value: "true"
            # Only cloudflared can reach the app (see network-policy.yaml).
            # Cloudflare overwrites X-Forwarded-Proto at the public edge.
            - name: TRUST_PROXY
              value: "true"
            - name: TOKEN_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: crosspoint-sync-connectors
                  key: token-enc-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: audioless-patch
              mountPath: /patches
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: audioless-patch
          configMap:
            name: crosspoint-sync-audioless-v1
        - name: data
          persistentVolumeClaim:
            claimName: crosspoint-sync-data

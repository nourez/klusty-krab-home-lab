apiVersion: apps/v1
kind: Deployment
metadata:
  name: crosspoint-sync
  namespace: crosspoint-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crosspoint-sync
  template:
    metadata:
      labels:
        app: crosspoint-sync
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: crosspoint-sync
          # Upstream main image, pinned for reproducible deployments.
          image: ghcr.io/crosspoint-reader/crosspoint-sync:main@sha256:63b78146990f0c5c17d32396316d7d5f8b11cc595ea7d64e1ed985aeccf7729f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: DATABASE_PATH
              value: /data/crosspoint.db
            # Allow initial account creation; disable after registering.
            - name: REGISTRATION_DISABLED
              value: "false"
            - name: TRUST_PROXY
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crosspoint-sync-data

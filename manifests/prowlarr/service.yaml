apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.242
  allocateLoadBalancerNodePorts: false
  loadBalancerSourceRanges:
    - 10.0.0.0/24
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 80
      targetPort: http

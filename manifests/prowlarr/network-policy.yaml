apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bookorbit
          podSelector:
            matchLabels:
              app: bookorbit
      ports:
        - protocol: TCP
          port: 9696

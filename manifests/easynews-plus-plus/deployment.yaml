apiVersion: apps/v1
kind: Deployment
metadata:
  name: easynews-plus-plus
  namespace: easynews-plus-plus
  labels:
    app: easynews-plus-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easynews-plus-plus
  template:
    metadata:
      labels:
        app: easynews-plus-plus
    spec:
      containers:
        - name: easynews-plus-plus
          image: ghcr.io/varming73/easynews-plus-plus:2.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          env:
            - name: TZ
              value: America/Toronto
            - name: PORT
              value: "1337"
            - name: ADDON_BASE_URL
              value: https://easynews-plus-plus.nourez.net
            - name: EASYNEWS_LOG_LEVEL
              value: info
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: easynews-plus-plus-secrets
                  key: tmdb-api-key
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: custom-titles
              mountPath: /app/custom-titles.json
              subPath: custom-titles.json
              readOnly: true
      volumes:
        - name: custom-titles
          configMap:
            name: easynews-plus-plus-custom-titles

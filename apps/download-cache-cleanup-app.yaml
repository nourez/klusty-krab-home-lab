apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: download-cache-cleanup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nourez/klusty-krab-home-lab.git
    targetRevision: HEAD
    path: manifests/download-cache-cleanup
  destination:
    server: https://kubernetes.default.svc
    namespace: bookorbit
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
